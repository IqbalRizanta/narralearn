[project]
name = "narralearn-backend"
version = "0.1.0"
description = "NarraLearn AI backend — multimodal adaptive learning API"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "aiosqlite>=0.20.0",
  "alembic>=1.14.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "email-validator>=2.2.0",
  "argon2-cffi>=23.1.0",
  "PyJWT>=2.10.0",
  "httpx>=0.28.0",
  "aiofiles>=24.1.0",
  "python-multipart>=0.0.20",
  "arq>=0.26.0",
  "redis>=5.2.0",
  "pypdf>=5.1.0",
  "python-pptx>=1.0.2",
  "mutagen>=1.47.0",
  "av>=13.1.0",
  "numpy>=2.1.0",
  "structlog>=24.4.0",
]

[project.optional-dependencies]
ai = [
  "faster-whisper>=1.1.0",
  "speechbrain>=1.0.2",
  "torch>=2.5.0",
  "torchaudio>=2.5.0",
]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
  "asgi-lifespan>=2.1.0",
  "reportlab>=4.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "C4", "SIM"]
ignore = ["B008", "SIM105", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "B011"]
